services:
  api:
    build: .
    ports: ["8090:8090"]
    environment:
      FLOWPULSE_TEMPORAL_ADDRESS: temporal:7233
      FLOWPULSE_POSTGRES_DSN: postgresql://flowpulse:flowpulse@postgres:5432/flowpulse
      FLOWPULSE_OBJECT_STORE_ENDPOINT: http://minio:9000
    depends_on: [temporal, postgres, minio]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowpulse
      POSTGRES_PASSWORD: flowpulse
      POSTGRES_DB: flowpulse
    ports: ["5432:5432"]
  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: flowpulse
      POSTGRES_PWD: flowpulse
      POSTGRES_SEEDS: postgres
    depends_on: [postgres]
    ports: ["7233:7233"]
  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: flowpulse-local
      MINIO_ROOT_PASSWORD: flowpulse-local-only
    ports: ["9000:9000", "9001:9001"]
