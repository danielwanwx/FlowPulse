services:
  api:
    build:
      context: .
      args:
        FLOWPULSE_PRODUCER_GIT_SHA: ${FLOWPULSE_PRODUCER_GIT_SHA:-unattested}
        FLOWPULSE_WORKSPACE_WORKFLOW_BLOB_OID: ${FLOWPULSE_WORKSPACE_WORKFLOW_BLOB_OID:-unattested}
    command: python -m flowpulse_cp.main
    ports: ["8090:8090"]
    environment:
      FLOWPULSE_RUNTIME_MODE: local
      FLOWPULSE_TEMPORAL_ADDRESS: temporal:7233
      FLOWPULSE_POSTGRES_DSN: postgresql://flowpulse_cp_app:flowpulse-cp-local-only@postgres:5432/flowpulse
      FLOWPULSE_AUTHORIZATION_SERVICE_URL: http://authz:8091
      FLOWPULSE_AUTHORIZATION_SERVICE_TOKEN: flowpulse-api-authz-local-only
      FLOWPULSE_TEMPORAL_TASK_QUEUE: flowpulse-diagnosis-p0
      # Explicit local test credential. x-flowpulse-test-* headers never select
      # a tenant, subject, or role on this host-published API.
      FLOWPULSE_TRUSTED_AUTH_FIXTURE_TOKEN: ${FLOWPULSE_TEST_OWNER_TOKEN:?set_FLOWPULSE_TEST_OWNER_TOKEN_for_local_compose}
      # The default keeps the established owner-gate suite unchanged. The
      # production Gate 1 Compose proof explicitly rebuilds with a separate,
      # server-side tenant-minio fixture identity; browser headers never pick it.
      FLOWPULSE_TRUSTED_AUTH_FIXTURE_CONTEXT_JSON: '${FLOWPULSE_TEST_FIXTURE_CONTEXT_JSON:-{"tenant_id":"tenant-http","subject_id":"owner-http","roles":["owner"]}}'
      FLOWPULSE_LOCAL_DETERMINISTIC_EVIDENCE: "1"
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
      authz: {condition: service_healthy}
  worker:
    build:
      context: .
      args:
        FLOWPULSE_PRODUCER_GIT_SHA: ${FLOWPULSE_PRODUCER_GIT_SHA:-unattested}
        FLOWPULSE_WORKSPACE_WORKFLOW_BLOB_OID: ${FLOWPULSE_WORKSPACE_WORKFLOW_BLOB_OID:-unattested}
    command: python -m flowpulse_cp.worker
    environment:
      FLOWPULSE_TEMPORAL_ADDRESS: temporal:7233
      FLOWPULSE_POSTGRES_DSN: postgresql://flowpulse_cp_app:flowpulse-cp-local-only@postgres:5432/flowpulse
      FLOWPULSE_AUTHORIZATION_SERVICE_URL: http://authz:8091
      FLOWPULSE_AUTHORIZATION_SERVICE_TOKEN: flowpulse-worker-authz-local-only
      FLOWPULSE_TEMPORAL_TASK_QUEUE: flowpulse-diagnosis-p0
      FLOWPULSE_OBJECT_STORE_ENDPOINT: http://minio:9000
      FLOWPULSE_OBJECT_STORE_BUCKET: flowpulse-evidence
      FLOWPULSE_OBJECT_STORE_ACCESS_KEY: flowpulse-artifact-writer-local
      FLOWPULSE_OBJECT_STORE_SECRET_KEY: flowpulse-artifact-writer-local-only
      FLOWPULSE_SOURCE_READ_ENDPOINT: http://minio:9000
      FLOWPULSE_SOURCE_READ_BUCKET: flowpulse-sources
      FLOWPULSE_SOURCE_READ_PREFIX: controlled
      FLOWPULSE_SOURCE_READ_TENANT_ID: tenant-minio
      FLOWPULSE_SOURCE_READ_ACCESS_KEY: flowpulse-source-reader-tenant-minio
      FLOWPULSE_SOURCE_READ_SECRET_KEY: flowpulse-source-reader-tenant-minio-local-only
      FLOWPULSE_LOCAL_DETERMINISTIC_EVIDENCE: "1"
      FLOWPULSE_PROVIDER_MODE: ${FLOWPULSE_PROVIDER_MODE:-standard}
      FLOWPULSE_ENABLE_DETERMINISTIC_TEST_PROVIDERS: ${FLOWPULSE_ENABLE_DETERMINISTIC_TEST_PROVIDERS:-0}
      FLOWPULSE_PROMETHEUS_URL: ${FLOWPULSE_PROMETHEUS_URL:-}
      FLOWPULSE_PROMETHEUS_EXPRESSION: ${FLOWPULSE_PROMETHEUS_EXPRESSION:-flowpulse_checkout_error_rate}
      FLOWPULSE_CONNECTOR_ALLOWED_ORIGINS: ${FLOWPULSE_CONNECTOR_ALLOWED_ORIGINS:-}
      FLOWPULSE_CONNECTOR_ALLOW_PRIVATE_ORIGINS: ${FLOWPULSE_CONNECTOR_ALLOW_PRIVATE_ORIGINS:-0}
      FLOWPULSE_OTEL_QUERY_URL: ${FLOWPULSE_OTEL_QUERY_URL:-}
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
      authz: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/phase1a.rules.yml:/etc/prometheus/phase1a.rules.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 20
  authz:
    build:
      context: .
      args:
        FLOWPULSE_PRODUCER_GIT_SHA: ${FLOWPULSE_PRODUCER_GIT_SHA:-unattested}
        FLOWPULSE_WORKSPACE_WORKFLOW_BLOB_OID: ${FLOWPULSE_WORKSPACE_WORKFLOW_BLOB_OID:-unattested}
    command: python -m flowpulse_cp.main
    environment:
      FLOWPULSE_COMPONENT: authz
      PORT: "8091"
      FLOWPULSE_POSTGRES_DSN: postgresql://flowpulse_cp_app:flowpulse-cp-local-only@postgres:5432/flowpulse
      FLOWPULSE_AUTH_ASSERTION_ISSUER: flowpulse-local-authz
      FLOWPULSE_AUTH_ASSERTION_AUDIENCE: flowpulse.temporal-owner-gate.v1
      FLOWPULSE_AUTH_ASSERTION_ACTIVE_KEY_ID: local-k2
      FLOWPULSE_AUTH_ASSERTION_KEYRING_JSON: '{"local-k1":"flowpulse-retired-local-only","local-k2":"flowpulse-active-local-only"}'
      FLOWPULSE_AUTHZ_API_SERVICE_TOKEN: flowpulse-api-authz-local-only
      FLOWPULSE_AUTHZ_WORKER_SERVICE_TOKEN: flowpulse-worker-authz-local-only
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz')"]
      interval: 2s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowpulse
      POSTGRES_PASSWORD: flowpulse
      POSTGRES_DB: flowpulse
    volumes:
      - ./migrations/001_control_plane.sql:/docker-entrypoint-initdb.d/001_control_plane.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpulse -d flowpulse"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports: ["5433:5432"]
  migrate:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/migrations/apply.sh"]
    environment:
      PGPASSWORD: flowpulse
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres: {condition: service_healthy}
  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: flowpulse
      POSTGRES_PWD: flowpulse
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "temporal --address temporal:7233 operator namespace describe default >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: flowpulse-local-root
      MINIO_ROOT_PASSWORD: flowpulse-local-root-only
    volumes:
      - minio_data:/data
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 20
  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: flowpulse-local-root
      MINIO_ROOT_PASSWORD: flowpulse-local-root-only
      FLOWPULSE_OBJECT_STORE_BUCKET: flowpulse-evidence
      FLOWPULSE_OBJECT_STORE_ACCESS_KEY: flowpulse-artifact-writer-local
      FLOWPULSE_OBJECT_STORE_SECRET_KEY: flowpulse-artifact-writer-local-only
      FLOWPULSE_SOURCE_READ_BUCKET: flowpulse-sources
      FLOWPULSE_SOURCE_READ_ACCESS_KEY: flowpulse-source-reader-tenant-minio
      FLOWPULSE_SOURCE_READ_SECRET_KEY: flowpulse-source-reader-tenant-minio-local-only
    volumes:
      - ./minio/bootstrap.sh:/bootstrap.sh:ro
      - ./minio/policies:/policies:ro
      - ./minio/fixtures:/fixtures:ro
    depends_on:
      minio: {condition: service_healthy}

volumes:
  minio_data:
  postgres_data:
