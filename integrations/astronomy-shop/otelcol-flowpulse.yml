exporters:
  file/traces:
    path: /flowpulse/traces.jsonl
  file/metrics:
    path: /flowpulse/metrics.jsonl
  file/logs:
    path: /flowpulse/logs.jsonl

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, memory_limiter, transform/sanitize_spans, gen_ai_normalizer]
      exporters: [debug, span_metrics, file/traces]
    metrics:
      receivers: [docker_stats, http_check/frontend-proxy, host_metrics, nginx, otlp, redis, postgresql, prometheus/ad, span_metrics, kafkametrics]
      processors: [resourcedetection, memory_limiter]
      exporters: [debug, file/metrics]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, memory_limiter, transform/sanitize_logs]
      exporters: [debug, file/logs]
